<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGRINHO 2026 — Agro Forte, Futuro Sustentável</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════
       TOKENS
    ═══════════════════════════════════════ */
    :root {
      --ink:        #0f1a12;
      --forest:     #1b4332;
      --moss:       #2d6a4f;
      --leaf:       #52b788;
      --mist:       #d8f3dc;
      --soil:       #b5611a;
      --sand:       #f5ede0;
      --paper:      #fafaf7;
      --white:      #ffffff;
      --gray-400:   #9ca3a0;
      --gray-200:   #e8ebe8;

      --font-display: 'Fraunces', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
      --font-mono:    'DM Mono', monospace;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 16px;

      --shadow-card: 0 2px 12px rgba(15,26,18,.08), 0 1px 3px rgba(15,26,18,.05);
      --shadow-hover: 0 12px 40px rgba(15,26,18,.15);

      --transition: 0.25s cubic-bezier(.4,0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }

    /* ═══════════════════════════════════════
       NAV
    ═══════════════════════════════════════ */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15,26,18,.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.06);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--leaf);
      letter-spacing: .02em;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .nav-logo span { color: var(--white); font-weight: 300; font-style: italic; }

    .nav-links { display: flex; gap: 2rem; }
    .nav-links a {
      font-size: .85rem;
      font-weight: 500;
      color: rgba(255,255,255,.65);
      letter-spacing: .04em;
      text-transform: uppercase;
      transition: color var(--transition);
    }
    .nav-links a:hover { color: var(--leaf); }

    .nav-cta {
      background: var(--soil);
      color: var(--white) !important;
      padding: .45rem 1.1rem;
      border-radius: var(--radius-sm);
      font-weight: 600 !important;
      letter-spacing: .02em !important;
      text-transform: none !important;
      transition: background var(--transition), transform var(--transition) !important;
    }
    .nav-cta:hover { background: #93490f !important; transform: translateY(-1px); }

    /* ═══════════════════════════════════════
       HERO
    ═══════════════════════════════════════ */
    .hero {
      min-height: 92vh;
      background: var(--forest);
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* animated field lines */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          105deg,
          transparent 0,
          transparent 60px,
          rgba(82,183,136,.04) 60px,
          rgba(82,183,136,.04) 61px
        );
      pointer-events: none;
    }

    .hero-text {
      padding: 6rem 4rem 6rem 6rem;
      position: relative;
      z-index: 2;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: rgba(82,183,136,.15);
      border: 1px solid rgba(82,183,136,.3);
      color: var(--leaf);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .35rem .9rem;
      border-radius: 100px;
      margin-bottom: 2rem;
    }

    .hero-badge::before { content: '●'; font-size: .45rem; animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(3rem, 5vw, 5rem);
      font-weight: 900;
      color: var(--white);
      line-height: 1.05;
      letter-spacing: -.02em;
      margin-bottom: 1.5rem;
    }

    .hero h1 em {
      font-style: italic;
      font-weight: 300;
      color: var(--leaf);
    }

    .hero-sub {
      font-size: 1.1rem;
      color: rgba(255,255,255,.65);
      max-width: 440px;
      margin-bottom: 2.5rem;
      line-height: 1.75;
    }

    .hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; }

    .btn-primary {
      background: var(--leaf);
      color: var(--forest);
      font-weight: 700;
      font-size: .9rem;
      padding: .85rem 2rem;
      border-radius: var(--radius-sm);
      transition: background var(--transition), transform var(--transition);
      display: inline-block;
    }
    .btn-primary:hover { background: #3da374; transform: translateY(-2px); }

    .btn-ghost {
      border: 1px solid rgba(255,255,255,.25);
      color: rgba(255,255,255,.8);
      font-weight: 500;
      font-size: .9rem;
      padding: .85rem 2rem;
      border-radius: var(--radius-sm);
      transition: border-color var(--transition), color var(--transition);
      display: inline-block;
    }
    .btn-ghost:hover { border-color: var(--leaf); color: var(--leaf); }

    .hero-visual {
      position: relative;
      height: 100%;
      min-height: 92vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem;
    }

    /* big illustrated field */
    .field-illustration {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 80%, rgba(82,183,136,.18) 0%, transparent 70%),
        linear-gradient(180deg, var(--forest) 0%, #0d2b1f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16rem;
      opacity: .18;
      user-select: none;
    }

    .hero-stats {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: rgba(255,255,255,.08);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .stat-cell {
      background: rgba(15,26,18,.6);
      backdrop-filter: blur(8px);
      padding: 1.4rem 1.6rem;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--leaf);
      line-height: 1;
      letter-spacing: -.02em;
    }

    .stat-label {
      font-size: .78rem;
      color: rgba(255,255,255,.55);
      margin-top: .3rem;
      line-height: 1.4;
    }

    /* ═══════════════════════════════════════
       SECTION WRAPPER
    ═══════════════════════════════════════ */
    .wrapper {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .section { padding: 6rem 0; }

    .section-eyebrow {
      font-family: var(--font-mono);
      font-size: .7rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--soil);
      margin-bottom: .8rem;
    }

    .section-heading {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      font-weight: 700;
      color: var(--forest);
      line-height: 1.15;
      letter-spacing: -.01em;
      max-width: 560px;
    }

    .section-heading em { font-style: italic; font-weight: 300; color: var(--moss); }

    .divider {
      width: 40px;
      height: 3px;
      background: var(--leaf);
      border-radius: 2px;
      margin: 1.4rem 0 3rem;
    }

    /* ═══════════════════════════════════════
       INTRO STRIP
    ═══════════════════════════════════════ */
    .intro-strip {
      background: var(--mist);
      padding: 3rem 0;
      border-top: 3px solid var(--leaf);
    }

    .intro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }

    .intro-item {
      padding: 1.5rem 2rem;
      border-right: 1px solid rgba(45,106,79,.15);
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .intro-item:last-child { border-right: none; }

    .intro-icon {
      font-size: 1.8rem;
      flex-shrink: 0;
      margin-top: .1rem;
    }

    .intro-item h3 {
      font-size: .9rem;
      font-weight: 600;
      color: var(--forest);
      margin-bottom: .25rem;
    }

    .intro-item p { font-size: .82rem; color: #4a6358; line-height: 1.5; }

    /* ═══════════════════════════════════════
       ABOUT SECTION
    ═══════════════════════════════════════ */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: center;
    }

    .about-text p {
      color: #3a4f42;
      margin-bottom: 1.25rem;
      font-size: 1.02rem;
      line-height: 1.8;
    }

    .about-visual {
      background: var(--forest);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    .about-visual::after {
      content: '🌿';
      position: absolute;
      bottom: -1rem;
      right: -1rem;
      font-size: 8rem;
      opacity: .1;
    }

    .timeline { list-style: none; }

    .timeline-item {
      display: flex;
      gap: 1.2rem;
      margin-bottom: 1.8rem;
      position: relative;
    }

    .timeline-item:not(:last-child)::after {
      content: '';
      position: absolute;
      left: .95rem;
      top: 2rem;
      bottom: -1.4rem;
      width: 1px;
      background: rgba(82,183,136,.25);
    }

    .tl-dot {
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 50%;
      background: rgba(82,183,136,.2);
      border: 2px solid var(--leaf);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      color: var(--leaf);
      flex-shrink: 0;
      font-weight: 700;
    }

    .tl-content h4 {
      font-size: .92rem;
      font-weight: 600;
      color: var(--white);
      margin-bottom: .2rem;
    }

    .tl-content p { font-size: .82rem; color: rgba(255,255,255,.55); line-height: 1.5; }

    /* ═══════════════════════════════════════
       PILLARS / CARDS
    ═══════════════════════════════════════ */
    .pillars-bg { background: var(--sand); }

    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .pillar-card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 2rem;
      transition: box-shadow var(--transition), transform var(--transition);
      cursor: default;
    }
    .pillar-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-4px);
    }

    .pillar-icon {
      font-size: 2.4rem;
      margin-bottom: 1.2rem;
      display: block;
    }

    .pillar-tag {
      font-family: var(--font-mono);
      font-size: .65rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--soil);
      margin-bottom: .5rem;
    }

    .pillar-card h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--forest);
      margin-bottom: .8rem;
      line-height: 1.25;
    }

    .pillar-card p { font-size: .88rem; color: #4a6358; line-height: 1.7; }

    .pillar-list {
      list-style: none;
      margin-top: 1.2rem;
    }

    .pillar-list li {
      font-size: .82rem;
      color: #4a6358;
      padding: .3rem 0;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .pillar-list li::before {
      content: '→';
      color: var(--leaf);
      font-size: .8rem;
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════
       DATA / NUMBERS
    ═══════════════════════════════════════ */
    .data-section {
      background: var(--forest);
      padding: 6rem 0;
      position: relative;
      overflow: hidden;
    }

    .data-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 80% at 80% 50%, rgba(82,183,136,.1) 0%, transparent 65%);
      pointer-events: none;
    }

    .data-section .section-eyebrow { color: var(--leaf); opacity: .8; }
    .data-section .section-heading { color: var(--white); max-width: 500px; }
    .data-section .section-heading em { color: var(--leaf); }
    .data-section .divider { background: var(--soil); }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 4rem;
      align-items: center;
    }

    .data-numbers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: rgba(255,255,255,.08);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .data-cell {
      background: rgba(15,26,18,.5);
      padding: 2rem;
      position: relative;
    }

    .data-cell::after {
      content: attr(data-unit);
      position: absolute;
      top: 1.8rem;
      right: 1.6rem;
      font-family: var(--font-mono);
      font-size: .65rem;
      color: rgba(255,255,255,.3);
      letter-spacing: .1em;
    }

    .data-number {
      font-family: var(--font-display);
      font-size: 3rem;
      font-weight: 900;
      color: var(--leaf);
      line-height: 1;
      letter-spacing: -.03em;
    }

    .data-desc {
      font-size: .8rem;
      color: rgba(255,255,255,.5);
      margin-top: .5rem;
      line-height: 1.5;
    }

    .data-text p {
      color: rgba(255,255,255,.65);
      margin-bottom: 1.2rem;
      font-size: .97rem;
      line-height: 1.8;
    }

    .data-source {
      font-family: var(--font-mono);
      font-size: .72rem;
      color: rgba(255,255,255,.3);
      letter-spacing: .06em;
      margin-top: 2rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    /* ═══════════════════════════════════════
       ARTICLES
    ═══════════════════════════════════════ */
    .articles-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }

    .article-main {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: box-shadow var(--transition);
      display: flex;
      flex-direction: column;
    }
    .article-main:hover { box-shadow: var(--shadow-hover); }

    .article-thumb {
      height: 260px;
      background: linear-gradient(135deg, var(--forest) 0%, var(--moss) 50%, var(--leaf) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 6rem;
      position: relative;
      overflow: hidden;
    }

    .article-thumb-label {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: var(--soil);
      color: var(--white);
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: .3rem .8rem;
      border-radius: var(--radius-sm);
    }

    .article-body { padding: 2rem; flex: 1; display: flex; flex-direction: column; }

    .article-meta {
      font-family: var(--font-mono);
      font-size: .7rem;
      color: var(--gray-400);
      letter-spacing: .06em;
      margin-bottom: .8rem;
    }

    .article-body h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--forest);
      line-height: 1.25;
      margin-bottom: .8rem;
    }

    .article-body p { font-size: .9rem; color: #4a6358; line-height: 1.75; flex: 1; }

    .read-more {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      margin-top: 1.5rem;
      font-size: .82rem;
      font-weight: 600;
      color: var(--moss);
      transition: gap var(--transition), color var(--transition);
    }
    .read-more:hover { gap: .7rem; color: var(--soil); }
    .read-more::after { content: '→'; }

    .articles-sidebar { display: flex; flex-direction: column; gap: 1.5rem; }

    .article-small {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 1.4rem;
      display: flex;
      gap: 1rem;
      transition: box-shadow var(--transition);
    }
    .article-small:hover { box-shadow: var(--shadow-card); }

    .article-small-icon {
      width: 52px;
      height: 52px;
      background: var(--mist);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .article-small h3 {
      font-family: var(--font-display);
      font-size: .95rem;
      font-weight: 700;
      color: var(--forest);
      margin-bottom: .3rem;
      line-height: 1.3;
    }

    .article-small p { font-size: .78rem; color: #4a6358; line-height: 1.5; }

    /* ═══════════════════════════════════════
       QUOTE BAND
    ═══════════════════════════════════════ */
    .quote-band {
      background: var(--soil);
      padding: 5rem 0;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .quote-band::before {
      content: '"';
      font-family: var(--font-display);
      font-size: 40rem;
      color: rgba(255,255,255,.04);
      position: absolute;
      top: -10rem;
      left: 50%;
      transform: translateX(-50%);
      line-height: 1;
      pointer-events: none;
    }

    .quote-band blockquote {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-style: italic;
      font-weight: 300;
      color: var(--white);
      max-width: 780px;
      margin: 0 auto 1.5rem;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    .quote-band cite {
      font-family: var(--font-mono);
      font-size: .75rem;
      letter-spacing: .1em;
      color: rgba(255,255,255,.5);
      font-style: normal;
      position: relative;
      z-index: 1;
    }

    /* ═══════════════════════════════════════
       TIPS / PRACTICES
    ═══════════════════════════════════════ */
    .tips-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--gray-200);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .tip-cell {
      background: var(--white);
      padding: 2.5rem;
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      transition: background var(--transition);
    }
    .tip-cell:hover { background: var(--mist); }

    .tip-number {
      font-family: var(--font-display);
      font-size: 3rem;
      font-weight: 900;
      color: var(--mist);
      line-height: 1;
      flex-shrink: 0;
      width: 2.5rem;
    }

    .tip-cell h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--forest);
      margin-bottom: .5rem;
    }

    .tip-cell p { font-size: .86rem; color: #4a6358; line-height: 1.65; }

    /* ═══════════════════════════════════════
       NEWSLETTER
    ═══════════════════════════════════════ */
    .newsletter {
      background: var(--forest);
      border-radius: var(--radius-lg);
      padding: 4rem;
      display: fl
